<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Twitch Token Generator</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0e0e10;
      color: #efeff1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #18181b;
      padding: 30px;
      border-radius: 12px;
      width: 360px;
      text-align: center;
      border: 1px solid #303036;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #9146ff;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
    }
    .btn:hover { background: #772ce8; }
    .token-box {
      margin-top: 16px;
      padding: 10px;
      background: #000;
      border-radius: 6px;
      border: 1px solid #303036;
      word-break: break-all;
      color: #00f592;
      font-family: monospace;
      font-size: 13px;
      text-align: left;
    }
    .copy-btn { background: #00f592; color: #000; }
    .copy-btn:hover { background: #00d37e; }
  </style>
</head>
<body>

<div class="card">
  <h2 style="color: #a970ff; margin-top:0;">Twitch 認証ページ</h2>

  <div id="unauth">
    <p style="font-size: 13px; color: #adadb8;">ボタンを押して認証を許可すると、レイドツール用のトークンが発行されます。</p>
    <button class="btn" onclick="authorize()">🟣 Twitchで認証する</button>
  </div>

  <div id="auth" style="display: none;">
    <p style="color: #00f592; font-weight: bold; margin:0;">✅ 認証成功</p>
    <div class="token-box" id="tokenDisplay"></div>
    <button class="btn copy-btn" onclick="copyToken()">トークンをコピー</button>
  </div>
</div>

<script>
  const CLIENT_ID = 'wh00jngjvj1j24n192xjjozyqcgvv4';
  const REDIRECT_URI = 'https://futabatosiakitw-art.github.io/twitch-raid-tool/';

  window.onload = () => {
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const token = params.get('access_token');

    if (token) {
      document.getElementById('unauth').style.display = 'none';
      document.getElementById('auth').style.display = 'block';
      document.getElementById('tokenDisplay').innerText = token;
    }
  };

  function authorize() {
    const url = `https://id.twitch.tv/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=`;
    window.location.href = url;
  }

  function copyToken() {
    const token = document.getElementById('tokenDisplay').innerText;
    navigator.clipboard.writeText(token).then(() => {
      alert('トークンをコピーしました！ローカルのドック設定画面に貼り付けてください。');
    });
  }
</script>
</body>
</html>
