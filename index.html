<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Twitch Token Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0e0e10;
      color: #efeff1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #18181b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      width: 380px;
      text-align: center;
      border: 1px solid #303036;
    }
    h2 {
      margin-top: 0;
      color: #a970ff;
    }
    p {
      font-size: 13px;
      color: #adadb8;
      line-height: 1.5;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background-color: #9146ff;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #772ce8;
    }
    .token-box {
      margin-top: 20px;
      padding: 12px;
      background: #000;
      border-radius: 6px;
      border: 1px solid #303036;
      word-break: break-all;
      color: #00f592;
      font-family: monospace;
      font-size: 14px;
      text-align: left;
    }
    .copy-btn {
      background-color: #00f592;
      color: #000;
    }
    .copy-btn:hover {
      background-color: #00d37e;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Twitch Token Generator</h2>

  <!-- 未認証時の表示 -->
  <div id="unauthSection">
    <p>下のボタンを押してTwitchアカウントを認証すると、アクセストークンが発行されます。</p>
    <button class="btn" onclick="authorize()">🟣 Twitchで認証する</button>
  </div>

  <!-- 認証成功時の表示 -->
  <div id="authSection" style="display: none;">
    <p style="color: #00f592; font-weight: bold;">✅ 認証に成功しました！</p>
    <div class="token-box" id="tokenDisplay"></div>
    <button class="btn copy-btn" onclick="copyToken()">📋 1ポチでトークンをコピー</button>
    <button class="btn" onclick="authorize()" style="background: #26262c; color: #adadb8; margin-top: 8px;">再認証する</button>
  </div>
</div>

<script>
  const CLIENT_ID = 'wh00jngjvj1j24n192xjjozyqcgvv4';
  const REDIRECT_URI = 'https://futabatosiakitw-art.github.io/twitch-raid-tool/';

  window.onload = () => {
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');

    if (accessToken) {
      document.getElementById('unauthSection').style.display = 'none';
      document.getElementById('authSection').style.display = 'block';
      document.getElementById('tokenDisplay').innerText = accessToken;
    }
  };

  function authorize() {
    const authUrl = `https://id.twitch.tv/oauth2/authorize` +
      `?client_id=${CLIENT_ID}` +
      `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
      `&response_type=token` +
      `&scope=`;

    window.location.href = authUrl;
  }

  function copyToken() {
    const token = document.getElementById('tokenDisplay').innerText;
    navigator.clipboard.writeText(token).then(() => {
      alert('アクセストークンをクリップボードにコピーしました！');
    });
  }
</script>
</body>
</html>
