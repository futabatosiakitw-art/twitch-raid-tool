<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Raid Control Tool</title>
  <script src="https://embed.twitch.tv/embed/v1.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root { --bg: #0e0e10; --card: #1f1f23; --accent: #9146ff; --text: #efeff1; --text-muted: #adadb8; }
    body { margin: 0; padding: 8px; background: var(--bg); color: var(--text); font-family: sans-serif; font-size: 11px; box-sizing: border-box; user-select: none; }
    
    /* 本番表示モード (?display あり) */
    body.mode-display { width: 100vw; height: 100vh; overflow: hidden; background: transparent; padding: 0; }
    body.mode-display #display-root { display: block; }
    body.mode-display #dock-root { display: none; }
    #player-container { position: absolute; top: 0; left: 0; width: 640px; height: 360px; background: black; pointer-events: none; }
    #player-container iframe { width: 100%; height: 100%; border: none; }

    /* ドックリモコンモード (?display なし) */
    body.mode-dock { display: block; max-width: 450px; margin: 0 auto; }
    body.mode-dock #display-root { display: none; }
    body.mode-dock #dock-root { display: block; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #303036; padding-bottom: 4px; }
    .header h2 { margin: 0; font-size: 13px; color: var(--accent); }
    
    .tabs { display: flex; gap: 4px; border-bottom: 2px solid #303036; margin-bottom: 8px; }
    .tab-btn { flex: 1; padding: 6px; background: #26262c; color: var(--text-muted); border: none; cursor: pointer; font-weight: bold; border-radius: 4px 4px 0 0; font-size: 11px; }
    .tab-btn.active { background: var(--accent); color: #fff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .control-group { background: var(--card); padding: 8px; border-radius: 4px; margin-bottom: 8px; border-left: 3px solid var(--accent); }
    input[type="text"], input[type="password"] { width: 100%; padding: 6px; background: #000; color: #fff; border: 1px solid #464649; margin: 4px 0; box-sizing: border-box; font-size: 11px; border-radius: 4px; }
    
    button { background: #26262c; border: 1px solid #464649; color: var(--text); padding: 7px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; width: 100%; margin-top: 4px; }
    button:hover { background: #303036; border-color: var(--accent); }
    .btn-primary { background: var(--accent); color: white; border: none; }
    .btn-primary:hover { background: #772ce8; }
    .btn-danger { background: #eb0400; color: white; border: none; }
    .btn-danger:hover { background: #c50300; }
    .btn-sub { background: #26262c; color: var(--text); }

    .slider-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .slider-row label { width: 50px; font-size: 11px; color: var(--text-muted); }
    .slider-row input[type="range"] { flex: 1; }
    .slider-row span { width: 35px; text-align: right; }

    .dock-preview-box { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
    .dock-preview-box iframe { width: 100%; height: 100%; border: none; }

    .clip-list { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; max-height: 150px; overflow-y: auto; }
    .clip-item-btn { background: #18181b; border: 1px solid #303036; color: var(--text); padding: 6px; border-radius: 4px; text-align: left; cursor: pointer; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; margin: 0; }
    .clip-item-btn:hover { background: #26262c; border-color: var(--accent); }
  </style>

  <script>
    const CLIENT_ID = 'wh00jngjvj1j24n192xjjozyqcgvv4';
    const REDIRECT_URI = 'https://futabatosiakitw-art.github.io/twitch-raid-tool/';

    // ページ読み込み時にURLのパラメータやハッシュを監視して認証画面をサンドイッチする処理
    const pathParams = new URLSearchParams(window.location.search);
    const hashData = window.location.hash.substring(1);
    const hashParams = new URLSearchParams(hashData);
    const tokenFromUrl = hashParams.get('access_token');

    if (tokenFromUrl) {
      // 認証完了後のトークン表示画面
      window.onload = () => {
        document.body.innerHTML = `
          <div style="padding: 20px; text-align: center; background: #18181b; color: white; height: 100vh; font-family: sans-serif;">
            <h2 style="color: #00f592; margin-top: 20px;">✅ トークン取得成功！</h2>
            <p style="font-size: 13px; color: #adadb8;">以下のトークンをコピーして、OBSのリモコンツールの設定に貼り付けてください。</p>
            <input type="text" value="${tokenFromUrl}" readonly onclick="this.select()" style="width: 90%; max-width: 400px; padding: 12px; margin: 10px 0; text-align: center; font-weight: bold; background: #26262c; color: white; border: 1px solid #464649; border-radius: 4px;">
            <br>
            <button onclick="navigator.clipboard.writeText('${tokenFromUrl}').then(() => alert('コピーしました！このウィンドウを閉じてOBSに戻ってください。'))" style="padding: 12px 24px; background: #9146ff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px;">📋 トークンをコピー</button>
          </div>
        `;
      };
      throw new Error('Auth Token Display Mode');
    } else if (pathParams.has('auth')) {
      // Twitchの認証ページへ強制ジャンプするモード
      window.location.replace(`https://id.twitch.tv/oauth2/authorize?response_type=token&client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`);
      throw new Error('Redirecting to Twitch Auth');
    }
  </script>
</head>
<body>

<!-- 本番画面用ルート (?display あり) -->
<div id="display-root">
  <div id="player-container"></div>
</div>

<!-- ドックリモコンモード (?display なし) -->
<div id="dock-root">
  <div class="header">
    <h2>Raid Control Hub <span id="conn-status" style="font-size:9px; color:#ff4f4f;">● 未接続</span></h2>
  </div>

  <div class="tabs">
    <button type="button" class="tab-btn active" onclick="switchTab('clip', this)">クリップ操作</button>
    <button type="button" class="tab-btn" onclick="switchTab('vod', this)">今日のVOD</button>
    <button type="button" class="tab-btn" onclick="switchTab('settings', this)">設定</button>
  </div>

  <!-- クリップタブ -->
  <div id="tab-clip" class="tab-content active">
    <div class="control-group">
      <div style="display:flex; gap:4px;">
        <input type="text" id="targetUser" placeholder="レイド相手のTwitch IDを入力" style="margin:0;">
        <button type="button" class="btn-primary" onclick="loadUserData()" style="margin:0; width:100px;">情報読込</button>
      </div>
    </div>

    <div class="dock-preview-box" id="dockClipPreview"></div>

    <div class="control-group">
      <div class="slider-row">
        <label>🔊 音量</label>
        <input type="range" id="volRange" min="0" max="100" value="50" oninput="updateVolume()">
        <span id="valVol">50%</span>
      </div>
    </div>

    <button type="button" class="btn-primary" onclick="playTopClip()">🏆 最高再生数のクリップを再生</button>
    <button type="button" class="btn-sub" onclick="playFeaturedClip()">🌟 注目のクリップからランダム再生</button>
    <button type="button" class="btn-sub" onclick="nextClip()">🎲 通常クリップからランダム再生</button>
    <button type="button" class="btn-danger" onclick="stopMedia()">画面から消す</button>

    <div class="control-group" style="margin-top: 8px;">
      <div style="font-weight: bold; margin-bottom: 4px; color: var(--text-muted);">人気クリップ TOP 5 (クリックで再生)</div>
      <div id="clipTop5List" class="clip-list">
        <div style="color: #666; font-size: 10px;">ユーザー情報を読み込むと表示されます</div>
      </div>
    </div>
  </div>

  <!-- VODタブ -->
  <div id="tab-vod" class="tab-content">
    <div class="dock-preview-box" id="dockVodPreview"></div>
    <button type="button" class="btn-primary" onclick="loadTodayVod()">今日の最新VODを再生</button>
    <button type="button" class="btn-danger" onclick="stopMedia()" style="margin-top: 6px;">画面から消す</button>
  </div>

  <!-- 設定タブ -->
  <div id="tab-settings" class="tab-content">
    <div class="control-group">
      <div style="font-weight: bold; margin-bottom: 4px; color: var(--accent);">1. Twitch 認証設定</div>
      <button type="button" onclick="openAuthPage()">🔑 認証ページを開いてトークンを取得</button>
      <input type="text" id="token-input" placeholder="取得したアクセストークンをここに貼り付け">
      <button type="button" class="btn-primary" onclick="startConnection()">💾 保存 ＆ 接続開始</button>
    </div>

    <div class="control-group">
      <div style="font-weight: bold; margin-bottom: 4px; color: var(--accent);">2. 通信ID (合言葉) とURL発行</div>
      <input type="text" id="roomIdInput" placeholder="通信ID（例: my-raid-room）">
      <button type="button" class="btn-sub" onclick="saveRoomId()">ID適用・URL生成</button>
      <div style="margin-top: 6px; font-size: 10px; color: var(--text-muted);">OBSブラウザソース用URL:</div>
      <input type="text" id="sourceUrlDisplay" readonly onclick="this.select()">
      <button type="button" class="btn-sub" onclick="copySourceUrl()">📋 ソース用URLをコピー</button>
    </div>

    <div class="control-group">
      <div style="font-weight: bold; margin-bottom: 4px; color: var(--accent);">3. 位置・サイズ設定 (リアルタイム反映)</div>
      <div class="slider-row"><label>位置 X</label><input type="range" id="posX" min="0" max="1920" value="100" oninput="updateTransform()"><span id="valX">100px</span></div>
      <div class="slider-row"><label>位置 Y</label><input type="range" id="posY" min="0" max="1080" value="100" oninput="updateTransform()"><span id="valY">100px</span></div>
      <div class="slider-row"><label>横幅</label><input type="range" id="posW" min="200" max="1920" value="640" oninput="updateTransform()"><span id="valW">640px</span></div>
    </div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const isDisplayMode = urlParams.has('display');
  const roomIdParam = urlParams.get('room');

  const channel = new BroadcastChannel('raid_control_channel');
  let roomId = roomIdParam || localStorage.getItem('tw_room_id') || 'my-raid-room';
  let accessToken = localStorage.getItem('tw_token') || '';

  if (isDisplayMode) {
    document.body.classList.add('mode-display');
    initDisplayMode();
  } else {
    document.body.classList.add('mode-dock');
    initDockMode();
  }

  function switchTab(tabName, btnEl) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    if (btnEl) btnEl.classList.add('active');
    document.getElementById(`tab-${tabName}`).classList.add('active');
  }

  function initDisplayMode() {
    const container = document.getElementById('player-container');
    let twitchEmbed = null;
    let currentVolume = 0.5;

    const peer = new Peer('raid-room-' + roomId);
    peer.on('connection', (conn) => {
      conn.on('data', (data) => handleCommand(data));
    });

    channel.onmessage = (event) => handleCommand(event.data);

    function handleCommand(data) {
      if (data.type === 'TRANSFORM') {
        container.style.left = `${data.x}px`;
        container.style.top = `${data.y}px`;
        container.style.width = `${data.width}px`;
        container.style.height = `${Math.round(data.width * 9 / 16)}px`;
      } 
      else if (data.type === 'SET_VOLUME') {
        currentVolume = data.volume;
        if (twitchEmbed) {
          try {
            const player = twitchEmbed.getPlayer();
            if (player) {
              player.setVolume(currentVolume);
              if (currentVolume > 0 && player.isMuted()) player.setMuted(false);
            }
          } catch (e) {}
        }
      }
      else if (data.type === 'PLAY_MEDIA') {
        container.innerHTML = '';
        if (data.volume !== undefined) currentVolume = data.volume;

        if (data.mediaType === 'clip') {
          twitchEmbed = null;
          const clipUrl = `https://clips.twitch.tv/embed?clip=${data.id}&parent=futabatosiakitw-art.github.io&autoplay=true&muted=false`;
          container.innerHTML = `<iframe src="${clipUrl}" allow="autoplay; encrypted-media"></iframe>`;
        } 
        else if (data.mediaType === 'vod') {
          const options = {
            width: '100%',
            height: '100%',
            parent: ['futabatosiakitw-art.github.io'],
            autoplay: true,
            muted: false,
            video: data.id
          };
          twitchEmbed = new Twitch.Embed('player-container', options);
          twitchEmbed.addEventListener(Twitch.Embed.VIDEO_READY, () => {
            const player = twitchEmbed.getPlayer();
            if (player) {
              player.play();
              player.setVolume(currentVolume);
              player.setMuted(false);
            }
          });
        }
      } 
      else if (data.type === 'STOP_MEDIA') {
        container.innerHTML = '';
        twitchEmbed = null;
      }
    }
  }

  let rawClipsData = [];
  let clipsPool = [];
  let featuredClipsPool = [];
  let currentClipIdx = 0;
  let currentFeaturedIdx = 0;
  let currentBroadcasterId = '';
  let peer = null;
  let conn = null;

  function initDockMode() {
    peer = new Peer();
    peer.on('open', () => connectToDisplay());

    window.onload = () => {
      document.getElementById('roomIdInput').value = roomId;
      updateSourceUrlDisplay();

      if (accessToken) {
        document.getElementById('token-input').value = accessToken;
        validateAndStart();
      }

      updateTransform();
      updateVolume();
    };
  }

  function openAuthPage() {
    // ?auth をつけて別窓で開くことで専用の認証ポップアップとして機能させる
    window.open(REDIRECT_URI + '?auth', '_blank', 'width=500,height=600');
  }

  function startConnection() {
    const inputEl = document.getElementById('token-input');
    let rawInput = inputEl ? inputEl.value.trim() : '';
    if (!rawInput) { alert('トークンを入力してください'); return; }

    let cleanToken = rawInput;
    if (rawInput.includes('access_token=')) {
      try {
        const parts = rawInput.split('access_token=')[1];
        cleanToken = parts.split('&')[0];
      } catch (e) {}
    } else if (rawInput.includes('#')) {
      try {
        const hashPart = rawInput.split('#')[1];
        const p = new URLSearchParams(hashPart);
        if (p.get('access_token')) cleanToken = p.get('access_token');
      } catch (e) {}
    }

    accessToken = cleanToken;
    localStorage.setItem('tw_token', accessToken);
    validateAndStart();
  }

  async function validateAndStart() {
    try {
      const res = await fetch('https://id.twitch.tv/oauth2/validate', { headers: { 'Authorization': `OAuth ${accessToken}` } });
      if (!res.ok) throw new Error();
      const data = await res.json();
      
      const status = document.getElementById('conn-status');
      if (status) {
        status.innerText = `● 接続中 (${data.login})`;
        status.style.color = '#00f076';
      }
      document.getElementById('token-input').value = accessToken;
      alert(`✅ 接続成功！ (${data.login} さんで接続しました)`);
    } catch(e) {
      const status = document.getElementById('conn-status');
      if (status) {
        status.innerText = '● トークン要再取得';
        status.style.color = '#ff4f4f';
      }
      alert('❌ トークンが無効または期限切れです');
    }
  }

  function saveRoomId() {
    const inputVal = document.getElementById('roomIdInput').value.trim();
    if (!inputVal) { alert('通信IDを入力してください'); return; }
    roomId = inputVal;
    localStorage.setItem('tw_room_id', roomId);
    updateSourceUrlDisplay();
    connectToDisplay();
    alert('✅ 通信IDを適用し、URLを更新しました！');
  }

  function updateSourceUrlDisplay() {
    const el = document.getElementById('sourceUrlDisplay');
    if (el) el.value = `${REDIRECT_URI}?display&room=${roomId}`;
  }

  function connectToDisplay() {
    if (!peer || peer.destroyed) return;
    conn = peer.connect('raid-room-' + roomId);
    conn.on('open', () => {
      updateTransform();
      updateVolume();
    });
  }

  function sendCommand(data) {
    channel.postMessage(data);
    if (conn && conn.open) {
      conn.send(data);
    } else {
      connectToDisplay();
      setTimeout(() => { if (conn && conn.open) conn.send(data); }, 500);
    }
  }

  function copySourceUrl() {
    const urlInput = document.getElementById('sourceUrlDisplay');
    urlInput.select();
    navigator.clipboard.writeText(urlInput.value).then(() => {
      alert('📋 ブラウザソース用URLをコピーしました！');
    });
  }

  function updateTransform() {
    const x = document.getElementById('posX').value;
    const y = document.getElementById('posY').value;
    const w = document.getElementById('posW').value;
    document.getElementById('valX').innerText = `${x}px`;
    document.getElementById('valY').innerText = `${y}px`;
    document.getElementById('valW').innerText = `${w}px`;
    sendCommand({ type: 'TRANSFORM', x: parseInt(x), y: parseInt(y), width: parseInt(w) });
  }

  function updateVolume() {
    const vol = document.getElementById('volRange').value;
    document.getElementById('valVol').innerText = `${vol}%`;
    sendCommand({ type: 'SET_VOLUME', volume: parseFloat(vol) / 100 });
  }

  function shuffle(array) {
    const copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  async function loadUserData() {
    const username = document.getElementById('targetUser').value.trim();
    if (!username) { alert('レイド相手のTwitch IDを入力してください'); return; }
    if (!accessToken) { alert('「設定」タブからトークンを設定してください'); return; }

    try {
      const res = await fetch(`https://api.twitch.tv/helix/users?login=${username}`, {
        headers: { 'Client-ID': CLIENT_ID, 'Authorization': `Bearer ${accessToken}` }
      });
      const data = await res.json();
      if (data.data && data.data.length > 0) {
        currentBroadcasterId = data.data[0].id;
        await fetchClips();
        alert(`✅ ${data.data[0].display_name} さんの情報を読み込みました！`);
      } else {
        alert('ユーザーが見つかりませんでした');
      }
    } catch(e) {
      alert('情報の取得に失敗しました');
    }
  }

  async function fetchClips() {
    const res = await fetch(`https://api.twitch.tv/helix/clips?broadcaster_id=${currentBroadcasterId}&first=100`, {
      headers: { 'Client-ID': CLIENT_ID, 'Authorization': `Bearer ${accessToken}` }
    });
    const data = await res.json();
    
    if (data.data && data.data.length > 0) {
      rawClipsData = data.data;
      clipsPool = shuffle(rawClipsData);
      currentClipIdx = 0;
      renderTop5List(rawClipsData.slice(0, 5));

      const featRes = await fetch(`https://api.twitch.tv/helix/clips?broadcaster_id=${currentBroadcasterId}&is_featured=true&first=100`, {
        headers: { 'Client-ID': CLIENT_ID, 'Authorization': `Bearer ${accessToken}` }
      });
      const featData = await featRes.json();
      featuredClipsPool = (featData.data && featData.data.length > 0) ? shuffle(featData.data) : [];
      currentFeaturedIdx = 0;
    }
  }

  function renderTop5List(clips) {
    const container = document.getElementById('clipTop5List');
    container.innerHTML = '';
    clips.forEach((clip, index) => {
      const btn = document.createElement('button');
      btn.className = 'clip-item-btn';
      btn.innerText = `▶ ${index + 1}. ${clip.title} (👀 ${clip.view_count.toLocaleString()}回)`;
      btn.onclick = () => playClipById(clip.id);
      container.appendChild(btn);
    });
  }

  function playClipById(clipId) {
    const clipUrl = `https://clips.twitch.tv/embed?clip=${clipId}&parent=futabatosiakitw-art.github.io&autoplay=true&muted=true`;
    document.getElementById('dockClipPreview').innerHTML = `<iframe src="${clipUrl}" allow="autoplay"></iframe>`;
    const vol = parseFloat(document.getElementById('volRange').value) / 100;
    sendCommand({ type: 'PLAY_MEDIA', mediaType: 'clip', id: clipId, volume: vol });
  }

  function playTopClip() {
    if (rawClipsData.length === 0) { alert('先にクリップ情報を読み込んでください'); return; }
    playClipById(rawClipsData[0].id);
  }

  function playFeaturedClip() {
    if (featuredClipsPool.length > 0) {
      const clip = featuredClipsPool[currentFeaturedIdx];
      playClipById(clip.id);
      currentFeaturedIdx = (currentFeaturedIdx + 1) % featuredClipsPool.length;
      if (currentFeaturedIdx === 0) featuredClipsPool = shuffle(featuredClipsPool);
    } else {
      nextClip();
    }
  }

  function nextClip() {
    if (clipsPool.length === 0) { alert('クリップ情報がありません'); return; }
    const clip = clipsPool[currentClipIdx];
    playClipById(clip.id);
    currentClipIdx = (currentClipIdx + 1) % clipsPool.length;
    if (currentClipIdx === 0) clipsPool = shuffle(clipsPool);
  }

  async function loadTodayVod() {
    if (!currentBroadcasterId) { alert('先にクリップタブでユーザー情報を読み込んでください'); return; }
    const res = await fetch(`https://api.twitch.tv/helix/videos?user_id=${currentBroadcasterId}&type=archive&first=1`, {
      headers: { 'Client-ID': CLIENT_ID, 'Authorization': `Bearer ${accessToken}` }
    });
    const data = await res.json();
    if (data.data && data.data.length > 0) {
      const vod = data.data[0];
      const vodUrl = `https://player.twitch.tv/?video=${vod.id}&parent=futabatosiakitw-art.github.io&autoplay=true&muted=true`;
      document.getElementById('dockVodPreview').innerHTML = `<iframe src="${vodUrl}" allow="autoplay"></iframe>`;
      const vol = parseFloat(document.getElementById('volRange').value) / 100;
      sendCommand({ type: 'PLAY_MEDIA', mediaType: 'vod', id: vod.id, volume: vol });
    } else {
      alert('アーカイブ（VOD）が見つかりませんでした');
    }
  }

  function stopMedia() {
    document.getElementById('dockClipPreview').innerHTML = '';
    document.getElementById('dockVodPreview').innerHTML = '';
    sendCommand({ type: 'STOP_MEDIA' });
  }
</script>
</body>
</html>
